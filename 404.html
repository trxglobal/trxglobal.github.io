<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 | TRX Global</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- css --><style>
/* TRX Global 落地页样式：白底 + 红色品牌色，胶囊按钮、大圆角卡片；无外部依赖，保证广告落地页首屏速度 */
:root {
  --bg: #ffffff;
  --bg-2: #f6f6f8;
  --card: #ffffff;
  --line: #ebebef;
  --text: #111114;
  --muted: #5f6270;
  --accent: #e5112d;
  --accent-d: #c40d25;
  --accent-soft: #fdecee;
  --ok: #10a36a;
  --ok-soft: #e7f7f0;
  --bad: #d7263d;
  --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 8px 24px rgba(17, 17, 20, .06);
  --radius: 20px;
  --max: 1160px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans SC", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img, svg { display: block; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }

/* 顶栏 */
.nav {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255, 255, 255, .9);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.nav .wrap { display: flex; align-items: center; gap: 20px; height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; text-decoration: none; font-size: 19px; white-space: nowrap; letter-spacing: -.2px; }
.brand svg { width: 30px; height: 30px; }
.nav-links { display: flex; gap: 26px; margin-left: 20px; }
.nav-links a { text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; }
.nav-links a:hover { color: var(--text); }
.nav-cta { margin-left: auto; display: flex; gap: 10px; align-items: center; }

/* 语言切换：还原 PhotonPay —— 圆形国旗 + 当前语言，悬停展开，按地区分组列出可选语言 */
.lsw { position: relative; }
.lsw-btn {
  display: flex; align-items: center; height: 44px; padding: 0 16px; border: 0; border-radius: 12px;
  background: transparent; color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  transition: background .2s;
}
.lsw.open .lsw-btn { background: rgba(229, 17, 45, .08); }
.lsw .flag { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
.lsw-btn .flag { margin-right: 8px; }
.lsw-btn .lbl { margin-right: 8px; white-space: nowrap; }
.lsw-btn svg.c { width: 14px; height: 14px; transition: transform .2s; }
.lsw.open svg.c { transform: rotate(180deg); }
/* 面板与按钮之间留 10px 透明区，鼠标移过去时不会断开悬停 */
.lsw-pop {
  position: absolute; top: 100%; left: 50%; padding-top: 10px; z-index: 30;
  visibility: hidden; opacity: 0; transform: translate(-50%, 4px); transition: opacity .2s, transform .2s, visibility .2s;
}
.lsw.open .lsw-pop { visibility: visible; opacity: 1; transform: translate(-50%, 0); }
/* 有鼠标的设备悬停即展开（同 PhotonPay）；触屏设备靠点击切换 .open */
@media (hover: hover) {
  .lsw:hover .lsw-btn { background: rgba(229, 17, 45, .08); }
  .lsw:hover svg.c { transform: rotate(180deg); }
  .lsw:hover .lsw-pop { visibility: visible; opacity: 1; transform: translate(-50%, 0); }
}
.lsw-pop ul {
  position: relative; width: 276px; margin: 0; padding: 24px; list-style: none;
  display: flex; flex-direction: column; gap: 16px;
  background: #fff; border: 1px solid #ebeef5; border-radius: 12px; box-shadow: 0 0 12px rgba(0, 0, 0, .12);
}
.lsw-pop ul::before {
  content: ""; position: absolute; top: -6px; left: calc(50% - 5px); width: 10px; height: 10px;
  background: #fff; border-left: 1px solid #ebeef5; border-top: 1px solid #ebeef5; transform: rotate(45deg);
}
.lsw-pop li {
  display: flex; align-items: center; min-height: 52px; padding: 4px 0 4px 8px; border-radius: 12px;
  cursor: pointer; transition: background .2s;
}
.lsw-pop li:hover { background: rgba(0, 0, 0, .04); }
.lsw-pop li .flag { margin-right: 8px; }
.lsw-pop .rn { padding-left: 8px; font-size: 14px; font-weight: 500; line-height: 22px; color: var(--text); }
.lsw-pop .rl { display: flex; align-items: center; white-space: nowrap; }
.lsw-pop .rl a {
  padding: 0 8px; font-size: 12px; font-weight: 500; line-height: 18px; text-decoration: none;
  color: rgba(17, 17, 20, .55); transition: color .2s;
}
.lsw-pop .rl a:hover { color: var(--text); }
.lsw-pop .rl a.on { color: var(--accent); }
.lsw-pop .rl i { width: 1px; height: 8px; background: rgba(0, 0, 0, .15); }

/* 按钮：胶囊形 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: 15px;
  text-decoration: none; border: 1.5px solid transparent; cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-d); }
.btn-ghost { border-color: var(--accent); color: var(--accent); background: #fff; }
.btn-ghost:hover { background: var(--accent-soft); }
.btn-lg { padding: 15px 30px; font-size: 17px; }

/* 首屏 */
.hero { padding: 72px 0 56px; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; }
.badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-d); font-size: 13px; font-weight: 600;
}
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.hero h1 { font-size: clamp(34px, 5.2vw, 60px); line-height: 1.12; margin: 20px 0 18px; letter-spacing: -1px; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { color: var(--muted); font-size: clamp(16px, 1.8vw, 19px); max-width: 600px; margin: 0 0 32px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-note { color: var(--muted); font-size: 13px; margin-top: 16px; }

/* 首屏插图：能量订单卡片 */
.hero-art { position: relative; padding: 28px 8px; }
.hero-art::before {
  content: ""; position: absolute; inset: 0 -10% 0 8%; border-radius: 36px;
  background: radial-gradient(120% 90% at 70% 20%, #ffd9de 0%, #fff0f2 45%, #f6f6f8 100%);
}
.mock {
  position: relative; max-width: 360px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 22px;
  box-shadow: 0 2px 4px rgba(17, 17, 20, .04), 0 24px 60px rgba(229, 17, 45, .14);
}
.mock-top { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 14px; }
.mock-top .ok { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 3px 10px; border-radius: 999px; }
.mock-top svg { width: 22px; height: 22px; }
.mock-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.mock-row span { color: var(--muted); }
.mock-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.mock-price { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 12px; }
.mock-price span { color: var(--muted); font-size: 14px; }
.mock-price b { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
.mock-bar { height: 6px; border-radius: 999px; background: var(--bg-2); overflow: hidden; }
.mock-bar i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #ff5a6e); }
.mock-foot { margin-top: 10px; font-size: 12.5px; color: var(--muted); text-align: center; }
.chip {
  position: absolute; background: #fff; border-radius: 999px; padding: 9px 16px; font-size: 13.5px; font-weight: 700;
  box-shadow: 0 10px 30px rgba(17, 17, 20, .1); white-space: nowrap;
}
.chip-a { top: 6px; left: -4px; color: var(--accent); }
.chip-b { bottom: 4px; right: -4px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 56px; border-top: 1px solid var(--line); }
.stat { padding: 24px 20px 0 0; }
.stat b { display: block; font-size: 34px; line-height: 1.15; font-weight: 800; letter-spacing: -.5px; }
.stat span { color: var(--muted); font-size: 14px; }

/* 通用区块 */
section { padding: 88px 0; }
section.alt { background: var(--bg-2); }
.sec-head { max-width: 720px; margin-bottom: 40px; }
.sec-head h2 { font-size: clamp(28px, 3.6vw, 42px); line-height: 1.2; margin: 0 0 12px; font-weight: 800; letter-spacing: -.6px; }
.sec-head p { color: var(--muted); margin: 0; font-size: 17px; }
.kicker { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }

.grid { display: grid; gap: 18px; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); }
section:not(.alt) .card { box-shadow: none; background: var(--bg-2); border-color: transparent; }
.card h3 { margin: 16px 0 6px; font-size: 19px; font-weight: 700; }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.ico svg { width: 22px; height: 22px; }

/* 对比 */
.compare .card h3 { margin-top: 0; display: flex; align-items: center; gap: 8px; }
.compare ul { list-style: none; padding: 0; margin: 14px 0 0; }
.compare li { position: relative; padding-left: 26px; color: var(--muted); font-size: 15px; margin: 10px 0; }
.compare li::before { position: absolute; left: 0; top: 0; font-weight: 700; }
.compare .bad li::before { content: "✕"; color: #c4c6cd; }
.compare .good { background: linear-gradient(145deg, var(--accent), #ff4d62); color: #fff; border-color: transparent; box-shadow: 0 16px 40px rgba(229, 17, 45, .25); }
.compare .good li { color: rgba(255, 255, 255, .92); }
.compare .good li::before { content: "✓"; color: #fff; }
.compare .good .tag { background: #fff; color: var(--accent); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: #fff; }

/* 价格 */
.price { display: flex; flex-direction: column; }
.price.hot { border: 2px solid var(--accent); position: relative; }
.price .ribbon { position: absolute; top: -13px; left: 28px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.price h3 { margin: 0; }
.price .amt { font-size: 48px; font-weight: 800; margin: 14px 0 2px; line-height: 1.1; letter-spacing: -1px; }
.price .amt small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.price ul { list-style: none; padding: 0; margin: 18px 0 26px; flex: 1; }
.price li { padding: 8px 0 8px 26px; position: relative; color: var(--muted); font-size: 15px; }
.price li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
.price .btn { width: 100%; }
.fine { color: var(--muted); font-size: 13px; margin-top: 18px; }

/* 步骤 */
.steps { counter-reset: s; grid-template-columns: repeat(4, 1fr); }
.step::before {
  counter-increment: s; content: counter(s);
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); color: #fff; font-weight: 800;
}

/* 开发者 */
.checks { list-style: none; padding: 0; margin: 0 0 26px; }
.checks li { padding: 8px 0 8px 28px; position: relative; color: var(--muted); }
.checks li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
.checks b { color: var(--text); }

/* FAQ */
.faq { max-width: 880px; }
.faq details { background: #fff; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; }
.faq summary { cursor: pointer; list-style: none; padding: 20px 56px 20px 24px; font-weight: 600; font-size: 17px; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; position: absolute; right: 24px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 24px; font-weight: 400; }
.faq details[open] summary::after { content: "−"; }
.faq details p { margin: 0; padding: 0 24px 20px; color: var(--muted); }

/* 底部 CTA：红色块收尾 */
.final { text-align: center; }
.final .box {
  border-radius: 32px; padding: 72px 24px; color: #fff;
  background: radial-gradient(600px 280px at 85% 0%, rgba(255, 255, 255, .18), transparent 70%), linear-gradient(135deg, var(--accent), #ff4d62);
}
.final h2 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 12px; font-weight: 800; letter-spacing: -.6px; }
.final p { color: rgba(255, 255, 255, .9); margin: 0 0 30px; font-size: 17px; }
.final .hero-cta { justify-content: center; }
.final .btn-primary { background: #fff; color: var(--accent); }
.final .btn-primary:hover { background: #fff5f6; }
.final .btn-ghost { border-color: #fff; color: #fff; background: transparent; }
.final .btn-ghost:hover { background: rgba(255, 255, 255, .14); }
.final .hero-note, .final .hero-note a { color: rgba(255, 255, 255, .92) !important; }

/* 页脚 */
footer { border-top: 1px solid var(--line); padding: 48px 0 96px; color: var(--muted); font-size: 14px; }
footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 24px; }
footer h4 { color: var(--text); margin: 0 0 12px; font-size: 15px; }
footer ul { list-style: none; padding: 0; margin: 0; }
footer li { margin: 8px 0; }
footer a { text-decoration: none; }
footer a:hover { color: var(--text); }
footer .legal { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 12.5px; line-height: 1.7; }
.flangs { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 28px; }
.flangs a[aria-current] { color: var(--text); font-weight: 600; }

/* 移动端底部常驻按钮 */
.mbar { display: none; }

/* 文档页（隐私政策） */
.doc { max-width: 820px; padding: 56px 16px 40px; }
.doc h1 { font-size: 36px; margin: 0 0 8px; font-weight: 800; letter-spacing: -.5px; }
.doc h2 { font-size: 20px; margin: 32px 0 8px; }
.doc p, .doc li { color: var(--muted); }
.doc a { color: var(--accent); }

@media (max-width: 960px) {
  .hero-grid { grid-template-columns: 1fr; gap: 32px; }
  .hero-art { max-width: 460px; }
  .g3, .steps { grid-template-columns: 1fr 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .nav-links { display: none; }
}
@media (max-width: 640px) {
  .g3, .g2, .steps { grid-template-columns: 1fr; }
  .hero { padding: 40px 0 32px; }
  section { padding: 60px 0; }
  .nav .btn-ghost { display: none; }
  .nav-cta { gap: 4px; }
  .lsw-btn { padding: 0 10px; }
  .lsw-btn .lbl { display: none; }
  .lsw-pop, .lsw.open .lsw-pop, .lsw:hover .lsw-pop { position: fixed; top: 68px; left: 16px; right: 16px; padding-top: 6px; transform: none; }
  .lsw-pop ul { width: auto; }
  .lsw-pop ul::before { display: none; }
  .hero-cta .btn { flex: 1 1 100%; }
  .hero-art::before { inset: 0 -16px; border-radius: 24px; }
  .chip-a { left: 4px; }
  .chip-b { right: 4px; }
  .stats { margin-top: 36px; }
  .final .box { border-radius: 24px; padding: 52px 20px; }
  footer .cols { grid-template-columns: 1fr; }
  .mbar {
    display: flex; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, .96); border-top: 1px solid var(--line);
  }
  .mbar .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .btn { transition: none; }
}

/* 联系方式 */
.contacts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.contact {
  display: flex; flex-direction: column; gap: 4px; padding: 22px; border-radius: var(--radius);
  background: var(--bg-2); text-decoration: none; transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
}
.contact:hover { background: #fff; box-shadow: var(--shadow); transform: translateY(-2px); }
.contact .ico { margin-bottom: 10px; }
.contact.tg .ico { background: #e6f4fb; color: #229ed9; }
.contact.wa .ico { background: #e5f8ed; color: #1ebe5b; }
.contact b { font-size: 16px; }
.contact span:not(.ico) { color: var(--muted); font-size: 13.5px; flex: 1; }
.contact em { font-style: normal; font-weight: 600; font-size: 14px; color: var(--accent); margin-top: 10px; word-break: break-all; }
.hero h1 em { white-space: nowrap; }
@media (max-width: 1100px) { .contacts { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) { .contacts { grid-template-columns: 1fr 1fr; } }

/* 窄屏适配：网格子项允许收缩，长按钮文字可换行，避免撑出横向滚动 */
.grid > * { min-width: 0; }
.price .btn, .contact em { white-space: normal; text-align: center; }
@media (max-width: 640px) {
  .price .amt { font-size: 40px; }
  .card { padding: 22px; }
}
/* 小屏手机（iPhone SE / 小尺寸安卓）：底部常驻栏已有注册按钮，顶栏只保留 logo 与语言切换 */
@media (max-width: 380px) {
  .nav .btn-primary { display: none; }
  .brand { font-size: 17px; gap: 8px; }
  .brand svg { width: 26px; height: 26px; }
  .hero h1 { font-size: 30px; }
  .stat b { font-size: 28px; }
  .contacts { grid-template-columns: 1fr; }
}
</style><!-- /css -->
</head>
<body>
<main class="doc" style="text-align:center;padding-top:120px">
  <h1>404</h1>
  <p>页面不存在 · 頁面不存在 · Page not found</p>
  <p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px">
    <a class="btn btn-primary" href="/">简体中文</a>
    <a class="btn btn-ghost" href="/zh-hant/">繁體中文</a>
    <a class="btn btn-ghost" href="/en/">English</a>
  </p>
</main>
</body>
</html>
